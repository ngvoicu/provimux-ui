name: Follow GitHub

# Runs on the owner's Forgejo server (the NAS) only, and brings the NAS's copy of provimux-ui up to GitHub's:
# main, the release tags v<X.Y.Z>-pmx.<n> and the upstream base tags v<X.Y.Z> they sit on. The NAS holds nothing else.
# GitHub reads .github/workflows/ only, so it never sees this file. Forgejo reads .forgejo/workflows/ and, while this
# folder exists, ignores .github/workflows/: on the NAS this is the only workflow (no guard, check, publish, release
# or upstream CI, which assume GitHub, its secrets and its environment). It is a layer file: every main and -pmx tag
# pushed from now on carries it.
# It runs only git: no repository code. The NAS is a mirror of GitHub's main: a fast-forward when it can be one;
# when GitHub's main is not a descendant of the NAS's (a sync rebases the layer onto each upstream release and pushes
# it with --force-with-lease), the NAS's main is first kept as refs/nas-backup/main-<UTC time>, then set to GitHub's,
# in one atomic push, so no commit is lost on the NAS. Never a merge commit; GitHub is only read. A tag is only ever
# added, never moved: a tag at another commit on GitHub is reported as an error and left as it is.
on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bring main to GitHub's
        run: |
          set -eu
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git fetch --no-tags https://github.com/ngvoicu/provimux-ui.git "+refs/heads/main:refs/remotes/github/main"
          here=$(git rev-parse --verify "refs/remotes/origin/main^{commit}")
          github=$(git rev-parse --verify "refs/remotes/github/main^{commit}")
          echo "NAS main: $here"
          echo "GitHub main: $github"
          if [ "$here" = "$github" ]; then
            echo "Already equal."
            exit 0
          fi
          if git merge-base --is-ancestor "$here" "$github"; then
            git push --force-with-lease="refs/heads/main:$here" origin "$github:refs/heads/main"
            echo "Fast-forward: the NAS's main is now $github."
            exit 0
          fi
          # GitHub's main is not a descendant of the NAS's (a sync rebased it, or the NAS got a commit GitHub lacks).
          # The NAS is a mirror: its main is kept as refs/nas-backup/main-<UTC time>, then set to GitHub's, in one
          # atomic push that holds only while the NAS's main is still the commit read above. Only the NAS changes.
          backup="refs/nas-backup/main-$(date -u +%Y%m%dT%H%M%SZ)"
          git push --atomic --force-with-lease="refs/heads/main:$here" origin "$here:$backup" "$github:refs/heads/main"
          echo "::warning::GitHub's main is not a descendant of the NAS's. The NAS's main $here is kept as $backup; main is now $github."
      - name: Add GitHub's new v<X.Y.Z> and -pmx tags
        run: |
          git fetch --no-tags https://github.com/ngvoicu/provimux-ui.git '+refs/tags/*:refs/github-tags/*'
          bad=0
          for ref in $(git for-each-ref --format='%(refname)' refs/github-tags/); do
            tag=${ref#refs/github-tags/}
            if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-pmx\.[0-9]+)?$'; then
              continue
            fi
            github=$(git rev-parse "$ref")
            here=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
            if [ -z "$here" ]; then
              git push origin "$ref:refs/tags/$tag"
              echo "Added $tag ($github)."
            elif [ "$here" != "$github" ]; then
              echo "::error::$tag is $here on the NAS and $github on GitHub. Left as it is."
              bad=1
            fi
          done
          exit "$bad"
