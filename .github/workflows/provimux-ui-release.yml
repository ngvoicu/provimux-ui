# provimux-ui release (PUI-10, PUI-12): a tag v<base>-pmx.<n> on main builds
# management.html, publishes it with checksums.txt as a prerelease of this repository,
# checks the published file and makes it the latest release. A manual run
# (workflow_dispatch) is a dry run: it builds and checks everything and publishes
# nothing; with the input "release" it instead runs the smoke and promote jobs against
# that published release and changes nothing.
#
# Order and trust (as in Provimux's provimux-release.yml):
#   build    read-only token, checkout without a stored credential; the only job that
#            runs repository code (release-meta.sh, release-auth.sh, guard.sh, bun
#            install, verify, build). On a tag push it first requires the release
#            authorization: the tag's commit carries the status provimux-ui-release for
#            exactly this tag from a provimux-ui-publish run or the owner (SYNC.md,
#            "Release authorization").
#   publish  contents: write with GITHUB_TOKEN; no checkout, no repository script:
#            fixed inline steps on the files the build job uploaded. Runs only for a
#            tag push, after the build job passed.
#   smoke    contents: read, no secret. Downloads the PUBLISHED release as anyone does
#            and checks it (release-check.sh: sha256 = checksums.txt = the API digest =
#            the build's, one page, title, MIT notice, version), then loads it in
#            chrome-headless-shell whose only proxy is a stub of the management API
#            (smoke.mjs: the login page renders, sign-in reaches the stub, nothing of the
#            whole browser leaves the stub).
#   promote  contents: write with GITHUB_TOKEN; no checkout, no repository script; one
#            at a time in the repository. Only after smoke passed: the release
#            authorization again, the release immutable with the checked digest, the
#            latest release read for certain; makes it the latest unless a newer one is,
#            and reads it back. On a dry run it says what it would do.
#   report   issues: write. When a job of a tag's release run failed or was cancelled,
#            the run opens or updates its "sync: v<base>" issue itself
#            (release-report.sh).
#
# Every release is published as a PRERELEASE first. GitHub's "latest release", which
# the console updater of Provimux and CLIProxyAPI reads (releases/latest), skips
# prereleases, so a new console reaches installs only once the smoke job has checked
# the published file; if any check fails it stays a prerelease, the run is red and the
# sync issue says why (.github/provimux/SYNC.md, "Promotion"). Assets of a published
# release are never replaced.
#
# Upstream's release.yml (any v* tag) and ci.yml stay in the tree unchanged and are
# disabled in the repository settings (.github/provimux/upstream-workflows.md).
name: provimux-ui-release

on:
  push:
    tags:
      - 'v*-pmx.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the dry run (e.g. v1.28.3-pmx.0-dryrun); empty = v<base>-pmx.0-dryrun'
        required: false
        default: ''
      release:
        description: 'Instead of a build: check this published release (v<base>-pmx.<n>) as the smoke and promote jobs would; nothing changes'
        required: false
        default: ''

permissions:
  contents: read

# One run per ref at a time; a second push of the same tag waits.
concurrency:
  group: provimux-ui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # release-auth.sh reads the tag's commit statuses and the publish run.
      statuses: read
      actions: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      base: ${{ steps.meta.outputs.base }}
      publish: ${{ steps.meta.outputs.publish }}
      sha256: ${{ steps.file.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # The tag must name this tree's base: the upstream console release below the layer.
      - name: Version and base
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash .github/provimux/release-meta.sh

      # Only a tag that provimux-ui-publish pushed (or the owner authorized) is built:
      # its commit must carry the release authorization for exactly this tag.
      - name: Release authorization (tag pushes)
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PMX_REPO: ${{ github.repository }}
        run: bash .github/provimux/release-auth.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Check the Provimux layer (guard)
        env:
          PMX_EXPECT_BASE: ${{ steps.meta.outputs.base }}
          PMX_EXPECT_BASE_COMMIT: ${{ steps.meta.outputs.base_commit }}
        run: bash .github/provimux/guard.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The Bun version package.json pins (packageManager), as provimux-ui-check tests with.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (tests, lint, build)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: bun run verify

      - name: Build management.html
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: bun run build

      - name: Check the file and write checksums
        id: file
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          mkdir release
          mv dist/index.html release/management.html
          f=release/management.html
          [[ -z "$(find dist -mindepth 1 -print -quit)" ]] || fail "The build left more than index.html: $(find dist -mindepth 1 | tr "\n" " ")"
          # One self-contained page: no external scripts or stylesheets.
          ! grep -Eq '<script[^>]*src=|<link[^>]*rel="?stylesheet' "$f" || fail "management.html loads external files."
          grep -Fq -e "\"${VERSION}\"" -e "\`${VERSION}\`" "$f" || fail "management.html does not carry version ${VERSION}."
          grep -Fq '<title>Provimux by providers.dev</title>' "$f" || fail "management.html lacks the Provimux title."
          # The MIT notice: every line of LICENSE, in order, in the comment after the doctype.
          head -n 1 "$f" | grep -qix '<!doctype html>' || fail "management.html does not start with its doctype."
          [[ "$(sed -n 2p "$f")" == '<!--' ]] || fail "management.html lacks the license comment after the doctype."
          awk 'NR > 2 && /^-->$/ { exit } NR > 2' "$f" > "$RUNNER_TEMP/notice.txt"
          grep -v '^[[:space:]]*$' LICENSE > "$RUNNER_TEMP/license.txt"
          grep -Fxf "$RUNNER_TEMP/license.txt" "$RUNNER_TEMP/notice.txt" | diff -u "$RUNNER_TEMP/license.txt" - ||
            fail "management.html does not carry LICENSE's notice."
          cd release
          sha256sum management.html > checksums.txt
          echo "sha256=$(cut -d' ' -f1 checksums.txt)" >> "$GITHUB_OUTPUT"
          ls -l
          cat checksums.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BASE: ${{ steps.meta.outputs.base }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then ref="$GITHUB_REF_NAME"; else ref="$GITHUB_SHA"; fi
          readme="https://github.com/${GITHUB_REPOSITORY}/blob/${ref}/.github/README.md"
          original="https://github.com/router-for-me/Cli-Proxy-API-Management-Center"
          {
            echo "provimux-ui ${VERSION} by [providers.dev](https://providers.dev): the web console of [Provimux](https://github.com/ngvoicu/provimux), built on the [CLI Proxy API Management Center](${original}) ${BASE}."
            echo
            echo "- Console base: ${BASE}, the original's release: ${original}/releases/tag/${BASE}"
            echo "- Provimux's part is a thin layer on it: the providers.dev look and the Provimux brand, the Provimux version and links on the System page, no sponsor or affiliate links. Every page, setting and request is the original console's. See the [README](${readme})."
            echo "- Use it: give Provimux \`management.html\` with \`MANAGEMENT_STATIC_PATH\` and \`management.disable-auto-update-panel: true\` ([Use it](${readme}#use-it)); check it with \`sha256sum -c checksums.txt\`."
            echo
            echo "MIT licensed, like the original; \`management.html\` carries the license notice."
          } > release/release-notes.md
          cat release/release-notes.md | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  # Publish the GitHub release as a prerelease. A draft is created first, its assets'
  # digests are checked, then it is published and checked again as anyone sees it.
  # A rerun never replaces an asset: a published release must already hold this run's
  # files; a draft left by a failed run is resumed with only its missing assets.
  publish:
    needs: build
    if: ${{ needs.build.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      BASE: ${{ needs.build.outputs.base }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Publish release
        working-directory: release
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # Checked again here, without repository code: the tag the build job checked.
          [[ "$GITHUB_REF" == "refs/tags/$TAG" && "$TAG" == "$VERSION" ]] || fail "$GITHUB_REF is not the tag the build job checked ($VERSION)."
          [[ "$TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-pmx\.[0-9]+$ && "${BASH_REMATCH[1]}" == "$BASE" ]] ||
            fail "Tag $TAG does not name the base $BASE."
          [[ "$(sha256sum management.html)" == "$(cat checksums.txt)" ]] || fail "management.html does not match checksums.txt."
          declare -A want
          want[management.html]="$(sha256sum management.html | cut -d' ' -f1)"
          want[checksums.txt]="$(sha256sum checksums.txt | cut -d' ' -f1)"
          # The release(s) with this tag, drafts included (the tag endpoint skips drafts).
          release() {
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.TAG) | {id, draft, prerelease, assets: [.assets[] | {id, name, state, digest}]}' | jq -s .
          }
          # Check every asset present: expected name, fully uploaded, this run's digest
          # (downloaded and hashed when GitHub reports none). Prints the names missing.
          check() {
            local r=$1 bad=0 id name state digest got
            while IFS=$'\t' read -r id name state digest; do
              if [[ -z "${want[$name]:-}" ]]; then echo "::error::Unexpected asset $name" >&2; bad=1; continue; fi
              [[ "$state" == uploaded ]] || { echo "::error::Asset $name is $state" >&2; bad=1; continue; }
              if [[ -z "$digest" || "$digest" == null ]]; then
                got="sha256:$(gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$id" | sha256sum | cut -d' ' -f1)"
              else
                got="$digest"
              fi
              [[ "$got" == "sha256:${want[$name]}" ]] || { echo "::error::Asset $name is $got, this run built sha256:${want[$name]}" >&2; bad=1; }
            done < <(jq -r '.[0].assets[] | [.id, .name, .state, (.digest // "")] | @tsv' <<<"$r")
            [[ $bad -eq 0 ]] || return 1
            for f in "${!want[@]}"; do
              jq -e --arg f "$f" '.[0].assets | any(.name == $f)' <<<"$r" >/dev/null || echo "$f"
            done
          }
          r="$(release)"
          case "$(jq length <<<"$r")" in
            0)
              gh release create "$TAG" --draft --prerelease --verify-tag --title "provimux-ui $TAG" \
                --notes-file release-notes.md management.html checksums.txt
              r="$(release)"
              ;;
            1) ;;
            *) fail "Several releases have tag $TAG; delete the extra drafts and rerun." ;;
          esac
          missing="$(check "$r")" || fail "Release $TAG has assets that are not this run's; it is left as it is."
          if [[ "$(jq '.[0].draft' <<<"$r")" == false ]]; then
            [[ -z "$missing" ]] || fail "Published release $TAG lacks: $missing. Assets of a published release are not changed here."
            echo "Release $TAG is already published with this run's assets; nothing to do."
          else
            # This workflow's drafts are prereleases; any other draft was not made here.
            [[ "$(jq '.[0].prerelease' <<<"$r")" == true ]] || fail "Draft $TAG is not a prerelease; it was not made by this workflow. Left as it is."
            if [[ -n "$missing" ]]; then
              echo "Resuming draft $TAG; uploading: $missing"
              mapfile -t files <<<"$missing"
              gh release upload "$TAG" "${files[@]}"
              r="$(release)"
              missing="$(check "$r")" || fail "Draft $TAG has assets that are not this run's."
              [[ -z "$missing" ]] || fail "Draft $TAG still lacks: $missing"
            fi
            gh release edit "$TAG" --draft=false --prerelease
          fi
          # The public release, as anyone sees it.
          pub="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '{id, draft, prerelease, html_url, assets: [.assets[] | {id, name, state, digest}]}' | jq -s .)"
          [[ "$(jq '.[0].draft' <<<"$pub")" == false ]] || fail "Release $TAG is still a draft."
          missing="$(check "$pub")" || fail "Published release $TAG does not match this run."
          [[ -z "$missing" ]] || fail "Published release $TAG lacks: $missing"
          {
            echo "Release $TAG: $(jq -r '.[0].html_url' <<<"$pub") (prerelease: $(jq '.[0].prerelease' <<<"$pub")), assets matching this run:"
            echo
            sed 's/^/    /' checksums.txt
            echo "    $(sha256sum checksums.txt)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Checks the published release before it may become the latest. Read-only, no secret.
  smoke:
    needs: [build, publish]
    if: >-
      ${{ always() && ((github.event_name == 'push' && needs.publish.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.release != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha256: ${{ steps.check.outputs.sha256 }}
    steps:
      - name: The release
        id: tag
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then tag="$GITHUB_REF_NAME"; else tag="$INPUT_RELEASE"; fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-pmx\.[0-9]+$ ]] || { echo "::error::'$tag' is not v<base>-pmx.<n>"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # This run's scripts (the tagged commit on a tag push); tags for the tag's LICENSE.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check the published files (digests, page, title, MIT notice, version)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PMX_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          # On a tag push: the file this run's build job built.
          WANT: ${{ needs.build.outputs.sha256 }}
        run: bash .github/provimux/release-check.sh "$TAG" "$RUNNER_TEMP/release" "$WANT"

      # chrome-headless-shell, pinned: no Google services of its own, so every request
      # the stub-proxy refuses comes from the page.
      - name: Install chrome-headless-shell
        id: browser
        run: |
          path="$(npx -y @puppeteer/browsers@2.13.2 install chrome-headless-shell@158.0.8127.36 --path "$RUNNER_TEMP/browser" --format '{{path}}' | tail -n 1)"
          test -x "$path" || { echo "::error::chrome-headless-shell not installed ($path)"; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Load it in headless Chrome against a stub of the management API
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CHROME: ${{ steps.browser.outputs.path }}
        run: node .github/provimux/smoke.mjs "$RUNNER_TEMP/release/management.html" "$TAG"

  # Makes the checked release the latest. No checkout, no repository script. One
  # promotion at a time in the whole repository (different tags run in different
  # release concurrency groups); a second waits.
  promote:
    needs: [build, smoke]
    if: ${{ always() && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: provimux-ui-promote
      cancel-in-progress: false
      # Every waiting promotion waits (the default keeps one and cancels the others); a
      # promotion cancelled anyway is reported by the job "report".
      queue: max
    permissions:
      contents: write
      statuses: read
      actions: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.smoke.outputs.tag }}
      SHA: ${{ needs.smoke.outputs.sha256 }}
      BUILT: ${{ needs.build.outputs.sha256 }}
    steps:
      # Inline: no repository code. selftest.sh runs the lines between the markers.
      - name: Promote to the latest release
        run: |
          # >>> promote
          set -euo pipefail
          fail() { echo "::error title=promote $TAG::$*"; exit 1; }
          tag_re='^v[0-9]+\.[0-9]+\.[0-9]+-pmx\.[0-9]+$'
          [[ "$TAG" =~ $tag_re ]] || fail "no tag from the smoke job"
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]] || fail "no checked sha256 from the smoke job"
          dry=1
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            dry=0
            [[ "$GITHUB_REF" == "refs/tags/$TAG" && "$SHA" == "$BUILT" ]] || fail "the checked file is not this run's build ($SHA, built $BUILT)"
            commit="$GITHUB_SHA"
          else
            commit="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" || fail "cannot resolve $TAG"
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || fail "no commit for $TAG"

          # 1. Authorized: the tag's commit carries the provimux-ui-release status for exactly
          # this tag, from a provimux-ui-publish run of this repository on main, or from the
          # owner (SYNC.md, "Release authorization").
          auths="$(gh api "repos/$GH_REPO/commits/$commit/statuses?per_page=100" \
            --jq '.[] | select(.context == "provimux-ui-release" and .state == "success" and .description == env.TAG) | "\(.creator.login) \(.target_url // "")"')" ||
            fail "cannot read the statuses of $commit: not promoted"
          by=''
          while read -r login url; do
            [[ -n "$login" ]] || continue
            if [[ "$login" == "${GH_REPO%%/*}" ]]; then by="the owner"; break; fi
            [[ "$login" == "github-actions[bot]" && "$url" =~ ^https://github\.com/$GH_REPO/actions/runs/([0-9]+)$ ]] || continue
            run="${BASH_REMATCH[1]}"
            # That run is provimux-ui-publish on main, and its job "publish" pushed exactly
            # this tag at this commit and set the status: both named steps concluded success.
            if [[ "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.path == ".github/workflows/provimux-ui-publish.yml" and .event == "workflow_run"
                  and .head_branch == "main" and .repository.full_name == env.GH_REPO and .head_repository.full_name == env.GH_REPO')" == true ]] &&
              gh api "repos/$GH_REPO/actions/runs/$run/jobs?filter=all&per_page=100" |
              jq -e --arg push "Push $TAG at $commit (the only step with the token)" --arg auth "Authorize the release $TAG at $commit" '
                [.jobs[] | select(.name == "publish") | .steps[] | select(.conclusion == "success") | .name] as $ok
                | ($ok | index($push)) != null and ($ok | index($auth)) != null' >/dev/null; then
              by="provimux-ui-publish run $run"; break
            fi
          done <<<"$auths"
          [[ -n "$by" ]] || fail "$TAG ($commit) is not authorized by a provimux-ui-publish run or the owner: not promoted"
          echo "$TAG ($commit) authorized by $by."

          # 2. The release: published, immutable, still the checked file.
          state() { gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '"\(.draft) \(.prerelease) \(.immutable) \([.assets[] | select(.name == "management.html") | .digest // ""] | join(","))"'; }
          st="$(state)" || fail "cannot read release $TAG: not promoted"
          read -r draft pre immutable digest <<<"$st"
          [[ "$draft" == false ]] || fail "$TAG is a draft"
          [[ "$immutable" == true ]] || fail "$TAG is not an immutable release (its assets or tag could still change): not promoted"
          [[ "$digest" == "sha256:$SHA" ]] || fail "management.html of $TAG is now '$digest', the smoke job checked sha256:$SHA"

          # 3. The latest release, read for certain: a 404 is "none yet"; an answer must name a
          # v<base>-pmx.<n> tag ({} or malformed JSON is not "none"); anything else stops.
          latest() {
            local o t
            if o="$(gh api "repos/$GH_REPO/releases/latest" 2>/dev/null)"; then
              t="$(jq -r 'if type == "object" then (.tag_name // "") else "" end' <<<"$o" 2>/dev/null)" || t=''
              [[ "$t" =~ $tag_re ]] || { echo "releases/latest answered without a v<base>-pmx.<n> tag: '$(head -c 120 <<<"$o")'" >&2; return 1; }
              echo "$t"; return 0
            fi
            o="$(gh api "repos/$GH_REPO/releases/latest" 2>&1 >/dev/null)" || true
            case "$o" in *"HTTP 404"*) return 0 ;; esac
            echo "$o" | tail -n 1 >&2; return 1
          }
          now="$(latest)" || fail "cannot read the latest release: nothing changed"
          if [[ "$pre" == false && "$now" == "$TAG" ]]; then
            echo "$TAG is already the latest release; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if [[ -n "$now" && "$(printf '%s\n%s\n' "$now" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]]; then
            fail "the latest release is $now, newer than $TAG: $TAG is not made the latest (it stays as it is)"
          fi
          if [[ $dry -eq 1 ]]; then
            echo "Dry run: would run gh release edit $TAG --prerelease=false --latest (now: prerelease $pre, latest ${now:-none}); nothing changed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 4. Promote, then read back; anything else than the expected state is reported.
          if ! gh release edit "$TAG" --prerelease=false --latest >/dev/null; then
            fail "gh release edit failed; the release now reads '$(state 2>/dev/null || echo unreadable)', the latest is '$(latest 2>/dev/null || echo unreadable)': check it by hand"
          fi
          st="$(state)" || fail "edited, but $TAG cannot be read back: its state is unknown, check it by hand"
          read -r draft pre immutable digest <<<"$st"
          now="$(latest)" || fail "edited, but the latest release cannot be read back: the state is unknown, check it by hand"
          [[ "$pre" == false && "$now" == "$TAG" && "$digest" == "sha256:$SHA" ]] ||
            fail "edited, but it reads back as prerelease $pre, latest '$now', digest $digest: check it by hand"
          echo "$TAG is the latest release (management.html sha256 $SHA)." | tee -a "$GITHUB_STEP_SUMMARY"
          # <<< promote

  # A tag's release run that did not complete reports itself in the issue
  # "sync: v<base>": every failed or cancelled job, with its errors (release-report.sh,
  # the tag's own scripts, which its build job already ran; issues: write only).
  report:
    needs: [build, publish, smoke, promote]
    if: >-
      ${{ always() && github.event_name == 'push' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/provimux
          persist-credentials: false
      - name: Report the failed release in its sync issue
        env:
          GH_TOKEN: ${{ github.token }}
          PMX_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/provimux/release-report.sh "$GITHUB_REF_NAME" "$GITHUB_RUN_ID"
